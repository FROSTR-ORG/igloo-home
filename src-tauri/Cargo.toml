[package]
name = "igloo-home"
version = "0.2.0"
edition = "2024"

[lib]
name = "igloo_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables the loopback test-dispatch TCP server gated by
# `IGLOO_HOME_TEST_MODE` + `IGLOO_HOME_TEST_TOKEN`. Must never be enabled
# in release builds shipped to operators.
test-server = ["dep:subtle"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bech32 = "0.11"
chacha20poly1305 = "0.10"
hex = "0.4"
k256 = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = { version = "2.5", optional = true }
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "1"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
frost-secp256k1-tr-unofficial = "2.2.0"
bifrost-app = { path = "../../bifrost-rs/crates/bifrost-app" }
bifrost-bridge-tokio = { path = "../../bifrost-rs/crates/bifrost-bridge-tokio" }
bifrost-codec = { path = "../../bifrost-rs/crates/bifrost-codec" }
bifrost-core = { path = "../../bifrost-rs/crates/bifrost-core" }
bifrost-profile = { path = "../../bifrost-rs/crates/bifrost-profile" }
bifrost-signer = { path = "../../bifrost-rs/crates/bifrost-signer" }
frostr-utils = { path = "../../bifrost-rs/crates/frostr-utils" }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
bincode = "1"
